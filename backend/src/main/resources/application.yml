server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: secure-banking-app
  
  datasource:
    url: jdbc:postgresql://localhost:5432/secure_banking_db
    username: postgres
    password: your_postgres_password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  security:
    user:
      name: admin
      password: admin123

logging:
  level:
    com.securebank: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"